name: check

# The manual is the target of every Help link in the Quilzo admin, so the
# thing worth checking on every push is that each guide the application links
# to exists, that no link inside the manual lands nowhere, that every picture is
# in the repository, and that the committed pages are what src/ builds.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only: this checks files and writes nothing.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit, not by tag: a tag is a mutable pointer in somebody
      # else's repository. The same commits as Quilzo's own workflows.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: The site is what src/ builds, and every link and picture resolves
        run: go run ./gen -check
